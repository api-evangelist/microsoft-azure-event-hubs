name: Azure Event Hubs
description: Azure Event Hubs is a big data streaming platform and event ingestion service that can receive and process millions
  of events per second. It provides a distributed stream processing platform with low latency and seamless integration with
  Azure data and analytics services.
image: https://azure.microsoft.com/svghandler/event-hubs/
tags:
- Big Data
- Event Streaming
- IoT
- Message Ingestion
- Real-Time Processing
